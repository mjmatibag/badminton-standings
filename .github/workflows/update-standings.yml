name: Update standings
on:
  push:
    paths:
      - 'exports/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Pick the export changed in this push
        id: pick
        run: |
          CHANGED=""
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            # Only files that still exist in this checkout — deleted exports can't be built
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'exports/' | grep '\.json$' | while read -r f; do [ -f "$f" ] && echo "$f"; done || true)
          fi
          if [ -z "$CHANGED" ]; then
            CHANGED=$(ls exports/*.json 2>/dev/null | sort | tail -1 || true)
          fi
          if [ -z "$CHANGED" ]; then
            echo "No export file present — nothing to build (this is not an error)."
            exit 0
          fi
          LAST=$(echo "$CHANGED" | tail -1)
          echo "Using export: $LAST"
          echo "file=$LAST" >> "$GITHUB_OUTPUT"

      - name: Build standings.json
        if: steps.pick.outputs.file != ''
        # Compile ALL exports — files overlap (each is a full snapshot),
        # so build-standings.js dedupes matches by id across all of them.
        run: node build-standings.js exports/*.json

      - name: Commit and push standings
        if: steps.pick.outputs.file != ''
        run: |
          git config user.name "standings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add standings.json
          git diff --cached --quiet || (git commit -m "Update standings from export" && git push)
