<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badminton Standings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: presentation page — podium hero when session ends, full standings table below */
:root{
  --bg:#f4f3ee; --surface:#ffffff; --line:#e2dfd5; --fg:#1d1c18; --muted:#71706a;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:#e2f1ef;
  --good:#2f8f5b; --bad:#bf4040;
  --gold:#a97e12; --silver:#8a8f98; --bronze:#a86a3d;
  --warn-bg:#f7ecd4; --warn-ink:#6b4e0a;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#16171a; --surface:#1f2125; --line:#31343a; --fg:#ecebe5; --muted:#98978e;
  --accent:#2fb3a4; --accent-ink:#08201d; --accent-soft:#17332f;
  --good:#4fbf83; --bad:#e06c6c;
  --gold:#d9b24a; --silver:#aab0ba; --bronze:#c98a5c;
  --warn-bg:#3a2f12; --warn-ink:#e3c05a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16171a; --surface:#1f2125; --line:#31343a; --fg:#ecebe5; --muted:#98978e;
  --accent:#2fb3a4; --accent-ink:#08201d; --accent-soft:#17332f;
  --good:#4fbf83; --bad:#e06c6c;
  --gold:#d9b24a; --silver:#aab0ba; --bronze:#c98a5c;
  --warn-bg:#3a2f12; --warn-ink:#e3c05a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 56px;
}
.wrap{max-width:720px;margin:0 auto}
.muted{color:var(--muted)}
.sm{font-size:.8rem}
.center{text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.badge{display:inline-block;background:var(--warn-bg);color:var(--warn-ink);border-radius:99px;
  padding:4px 12px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.badge.live{background:var(--accent-soft);color:var(--accent)}
.pv-title{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin:10px 0 2px;text-wrap:balance}
.pv-sub{font-size:.85rem;color:var(--muted);margin:0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:1rem;font-variant-numeric:tabular-nums}
th{color:var(--muted);text-align:left;font-weight:600;font-size:.7rem;text-transform:uppercase;
  letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nm{white-space:normal;min-width:0}
.pos{color:var(--good);font-weight:700}
.neg{color:var(--bad);font-weight:700}
.podium{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:22px 0 4px;flex-wrap:wrap}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:20px 26px;text-align:center;min-width:168px;display:flex;flex-direction:column;gap:6px}
.pod .m{font-size:2.2rem}
.pod .n{font-size:1.5rem;font-weight:800}
.pod .d{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pod.p1{border-color:var(--gold);transform:scale(1.07)}
.pod.p2{border-color:var(--silver)}
.pod.p3{border-color:var(--bronze)}
.updated{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;margin:14px 0 0}
.tabs2{display:flex;gap:8px;justify-content:center;margin:18px 0 4px;flex-wrap:wrap}
.t2{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;
  padding:7px 14px;font:600 .82rem var(--font-body);cursor:pointer}
.t2.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.crt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.crt:last-child{border-bottom:0}
.crt .cn{font-weight:700;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.crt .tm{font-weight:700;font-size:1rem;min-width:0}
.rule{display:inline-flex;align-items:center;gap:7px}
.rule::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rule::before{animation:none}}
.empty{padding:34px 18px;text-align:center}
.empty .ico{font-size:2.4rem}
.empty p{max-width:40ch;margin:10px auto 0}
</style>

</head>
<body>
<div class="wrap" id="app">
  <div class="card empty"><div class="ico">🏸</div><p class="muted">Loading standings…</p></div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEDALS = ['🥇','🥈','🥉'], PCLS = ['p1','p2','p3'];

function fmtDate(ts){
  try{ return new Date(ts).toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'}); }
  catch(e){ return ''; }
}
function fmtTime(ts){
  try{ return new Date(ts).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return ''; }
}

function tableHTML(rows, ended){
  if (!rows || !rows.length) return '<p class="muted center">No standings yet.</p>';
  return `<div class="tbl"><table>
    <tr><th>#</th><th class="nm">Player</th><th>W–L</th><th>Win%</th><th>Point diff</th><th>Buchholz</th><th>Games</th></tr>
    ${rows.map((r,i) => `<tr>
      <td>${ended && r.games > 0 && i < 3 ? MEDALS[i] : (r.games > 0 ? i+1 : '·')}</td>
      <td class="nm">${esc(r.name)}</td>
      <td>${r.wins}–${r.losses}</td>
      <td>${r.games ? Math.round(r.winRate*100)+'%' : '—'}</td>
      <td class="${r.pd>0?'pos':r.pd<0?'neg':''}">${r.pd>0?'+':''}${r.pd}</td>
      <td>${r.games ? r.buchholz : '—'}</td>
      <td>${r.games}</td></tr>`).join('')}
  </table></div>`;
}

let tab = 'standings';
try{ tab = localStorage.getItem('bq_tab') || 'standings'; }catch(e){}
let lastData = null;

function render(d){
  const app = document.getElementById('app');
  if (!d || !Array.isArray(d.rows)){
    app.innerHTML = `<div class="card empty"><div class="ico">🏸</div>
      <p class="pv-title">No standings published yet</p>
      <p class="muted">The standings will appear here once the first results are published from the Badminton Queue app.</p></div>`;
    return;
  }
  lastData = d;
  const live = (d && d.live) || { courts: [], upcoming: [] };
  const nl = live.courts.length, nu = live.upcoming.length;
  const crt = (pre, a, b) => `<div class="crt"><span class="cn">${pre}</span>
    <span class="tm">${esc(a.join(' & '))}</span><span class="muted sm">vs</span>
    <span class="tm">${esc(b.join(' & '))}</span></div>`;
  const liveHTML = `<div class="card">${nl ? live.courts.map(c => crt('Court ' + c.num, c.a, c.b)).join('')
    : '<p class="muted center" style="margin:6px 0">No games on court right now.</p>'}</div>`;
  const upHTML = `<div class="card">${nu ? live.upcoming.map((s,i) => crt('#' + (i+1), s.a, s.b)).join('')
    : '<p class="muted center" style="margin:6px 0">The queue is empty.</p>'}</div>`;
  const ended = !!d.ended;
  const pod = ended && Array.isArray(d.champions) && d.champions.length ?
    `<div class="podium">${d.champions.slice(0,3).map((r,i) => `<div class="pod ${PCLS[i]}">
      <span class="m">${MEDALS[i]}</span><span class="n">${esc(r.name)}</span>
      <span class="d">${r.wins}W · ${Math.round(r.winRate*100)}% · PD ${r.pd>0?'+':''}${r.pd}</span></div>`).join('')}</div>` : '';
  app.innerHTML = `
    <div class="center"><span class="badge ${ended?'':'live'}">${ended ? 'Session complete' : 'Live standings'}</span></div>
    <h1 class="pv-title center">🏸 ${ended ? 'Final Standings' : 'Badminton Standings'}</h1>
    <p class="pv-sub center">${esc(fmtDate(d.sessionDate))} · doubles · first to 35</p>
    ${d.sample ? `<p class="center sm" style="margin:10px 0 0"><span class="badge">Sample data</span></p>` : ''}
    <div class="tabs2">
      <button class="t2${tab==='standings'?' on':''}" data-tab="standings">📊 Standings</button>
      <button class="t2${tab==='live'?' on':''}" data-tab="live">🏸 Live${nl ? ' · ' + nl : ''}</button>
      <button class="t2${tab==='upcoming'?' on':''}" data-tab="upcoming">⏭ Queue${nu ? ' · ' + nu : ''}</button>
    </div>
    ${tab==='standings' ? `${pod}
      <div class="card">${tableHTML(d.rows, ended)}
        <p class="sm muted" style="margin:10px 0 0">Rank: win rate → point difference → Buchholz median → wins.</p></div>` : ''}
    ${tab==='live' ? liveHTML : ''}
    ${tab==='upcoming' ? upHTML : ''}
    <p class="updated">${d.updated ? `Updated ${esc(fmtTime(d.updated))}` : ''}</p>`;
}

document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  tab = b.dataset.tab;
  try{ localStorage.setItem('bq_tab', tab); }catch(err){}
  render(lastData);
});

// Cache-bust: GitHub Pages serves standings.json with a 10-minute cache,
// so a plain reload can show stale data — the query key bypasses it.
// Polling runs in a Web Worker because browsers throttle timers in
// background tabs (an inactive PC tab would otherwise poll at most once
// per minute or stop entirely); a visibilitychange catch-up also refreshes
// the instant the tab becomes active again.
let loaded = false, lastUpdated = null;
function load(){
  fetch('standings.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      if (!loaded || d.updated !== lastUpdated){ loaded = true; lastUpdated = d.updated; render(d); }
    })
    .catch(() => { if (!loaded) render(null); });
}
load();
try{
  const w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){ postMessage(0); }, 30000);'])));
  w.onmessage = load;
}catch(e){ setInterval(load, 30000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>

</body>
</html>
